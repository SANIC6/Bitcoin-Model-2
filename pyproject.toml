[project]
name = "bitcoin-price"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SANIC6", email = "somayajivar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "coingecko-sdk>=4.2.1",
    "dotenv>=0.9.9",
    "logging>=0.4.9.6",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
    "torchmetrics>=1.9.0",
]

[project.scripts]
bitcoin-price = "bitcoin_price:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
